name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build, themes, and the archive rule
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Every shipped theme is contrast checked. A theme nobody exercises
      # rots silently and fails on the day it is needed.
      - name: Contrast floor
        run: npm run test:contrast

      # No prerendered route may import the database client.
      - name: Archive independence
        run: npm run test:static

      # No hex literal outside tokens.css, no organization named in a component.
      - name: Structural rules
        run: npm run test:tokens

      # The proof, not the promise: the public surface has to build with the
      # database environment variables absent entirely.
      - name: Build with no database credentials
        env:
          PUBLIC_SUPABASE_URL: ''
          PUBLIC_SUPABASE_ANON_KEY: ''
          SUPABASE_SERVICE_ROLE_KEY: ''
        run: |
          unset PUBLIC_SUPABASE_URL PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY
          npm run build

      - name: Check the archive actually rendered
        run: |
          test -f dist/index.html
          test -f dist/articles/index.html
          test -f dist/robots.txt
          test -f dist/sitemap-index.xml
          test -d dist/pagefind

      # The second theme has to build too, not just parse.
      - name: Build the alternate theme
        env:
          PUBLIC_ORG: example
        run: npm run build
