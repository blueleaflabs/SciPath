name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build, themes, and the archive rule
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The whole suite, not a list of its parts. This file once named
      # fourteen checks while `npm test` carried forty-odd, so a suite
      # outside the list failed on every laptop and CI stayed green (19.9).
      # One step, the same command a developer runs, so the two cannot drift.
      - name: The suite
        run: npm test

      # The proof, not the promise: the public surface has to build with the
      # database environment variables absent entirely.
      - name: Build with no database credentials
        env:
          PUBLIC_SUPABASE_URL: ''
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ''
          SUPABASE_SECRET_KEY: ''
        run: |
          unset PUBLIC_SUPABASE_URL PUBLIC_SUPABASE_PUBLISHABLE_KEY SUPABASE_SECRET_KEY
          npm run build

      # The archive rendered.
      #
      # These paths moved at 1.39, when the home page left the tenant tree
      # and became on demand, and the step went on asserting the old ones —
      # so CI has been red on this since, for a reason that is not a fault.
      # What is prerendered now is the per-tenant chrome; the home page,
      # /articles/ and /showcase/ are in the worker.
      #
      # Named per tenant rather than globbed, because "some directory
      # rendered" is the uniformly-wrong-output pass of 19.9.
      - name: Check the archive actually rendered
        run: |
          # A directory, not a file: the adapter emits a bundle.
          test -d dist/_worker.js
          test -f dist/_routes.json
          test -f dist/sitemap-index.xml
          # No dist/404.html: the 404 is on demand, because a static one is
          # served by Cloudflare before the worker and hides every public
          # page. npm test asserts the same thing from the other side.
          test ! -f dist/404.html
          for tenant in montavista svslc scipath example; do
            test -f "dist/$tenant/about/index.html"
            test -f "dist/$tenant/policies/index.html"
            test -f "dist/$tenant/robots.txt"
            test -d "dist/$tenant/pagefind"
          done

      # The second theme has to build too, not just parse.
      # Reads the built HTML rather than the source, so it catches a tenant
      # leak however it was caused.
      - name: No tenant names another tenant
        run: npm run test:output

      - name: Build the alternate theme
        env:
          PUBLIC_ORG: example
        run: npm run build

      # The migration has to apply to an empty database from 0001, not just
      # to whatever state a laptop happens to be in.
      - name: Migrations apply from empty
        run: |
          npx supabase start --exclude studio,imgproxy,pooler,realtime,vector
          npx supabase db reset
          npx supabase stop --no-backup
