<!doctype html><html><body>
<div class="mdx" data-md-editor data-required="0">
  <div class="mdx-bar" role="toolbar">
    <button type="button" class="mdx-btn" data-cmd="bold" data-keys="B" data-title="Bold">B</button>
    <button type="button" class="mdx-btn" data-cmd="h1" data-keys="⌥1" data-title="Heading 1">H1</button>
    <button type="button" class="mdx-btn" data-cmd="h2" data-keys="⌥2" data-title="Heading 2">H2</button>
    <button type="button" class="mdx-btn" data-cmd="h3" data-keys="⌥3" data-title="Heading 3">H3</button>
    <button type="button" class="mdx-btn" data-cmd="ul" data-keys="⇧8" data-title="Bulleted list">List</button>
    <button type="button" class="mdx-btn" data-cmd="indent" data-keys="null" data-title="Indent (Tab)">⇥</button>
    <button type="button" class="mdx-btn" data-cmd="outdent" data-keys="null" data-title="Outdent (Shift+Tab)">⇤</button>
    <button type="button" class="mdx-btn" data-cmd="link" data-keys="K" data-title="Link">Link</button>
  </div>
  <div class="mdx-linkbar" hidden><label><span>Address</span><input class="mdx-url" type="url"/></label><button type="button" class="mdx-link-ok">Add</button><button type="button" class="mdx-link-no">Cancel</button></div>
  <div class="mdx-edit" contenteditable="false" role="textbox" hidden></div>
  <textarea id="f" name="f" rows="4"></textarea>
  <p class="mdx-empty" hidden>Write.</p>
</div>
<script src="editor.js"></script>
</body></html>
