# The IRPD literature review, from the class's own template ("Literature
# Review IRPD", 2026-27). Three parts as the handout has them: the
# researcher's, the family Elder's, and the researcher's record of the
# oral feedback. The rubric the student self-evaluates against is the
# step's rubric in irpd-mvhs-2027.yaml, which is also what the teacher
# grades with.

id: literature-review
name: Literature review
version: 3
guidance: >-
  Synthesize and summarize what is known about your question and what it
  is worth to your research. Cite your sources in the text. Define any
  terms your reader may not know.
# On the class showcase (2.8): the introduction, the sources as a reading
# list, and the references.
showcase:
  title: What the literature says
  show:
    - { field: introduction, as: prose, label: Introduction }
    - { field: sources, as: list, label: Sources }
    - { field: beginning, as: prose }
    - { field: references, as: prose, label: References }

sections:
  - id: resources
    name: Resources
    fields:
      - id: resources
        kind: note
        text: |-
          - [MVHS Library Databases with Passwords](https://docs.google.com/document/d/1pBZ_eliiji3Dr1_pzZDX96ZBkDfx6cIX_YBJtLByxSM/edit?usp=sharing)
          - [What is an annotated bibliography?](https://sites.google.com/fuhsd.org/senior-annotated-project/annotated-bibliography?authuser=0)
          - IRPD sample lit reviews
            - [Toni Chen's Lit Review 2025-2026](https://docs.google.com/document/d/1LVHYEJtP95Hb8ueMYUL8oQCCLQf-snStZnsAM7BzYyk/edit?usp=sharing)
            - [Rohan Agarwal's Lit Review 2025-2026](https://docs.google.com/document/d/1e0_lrhbw2L0ub6eH6RTKNimOj7ivrQ1a6NRTNjiUgKU/edit?usp=sharing)
            - [Anish Durve's Lit Review 2025-2026](https://docs.google.com/document/d/13gKotyHBBH7pOAV4Mr-26lN6cghzEC0ap0Xj-OiWef4/edit?tab=t.0)
            - [Aanya Padhi's Lit Review 2025-2026](https://docs.google.com/document/d/1W-O8DlFT4IuqLj2e5aYCXP-W_Am_5JOC97WJBFAp-9E/edit?usp=sharing)
            - [Elaina Pan's Lit Review 2025-2026](https://docs.google.com/document/d/1DnHiLxGRhdfZ2EU1EhIJOmUmiUHpcKIGzwtvpHYJrm8/edit?usp=sharing)
  - id: part1
    name: "Part I: to be filled by the researcher"
    fields:
      - id: introduction
        kind: long
        prompt: "I. Introduction"
        tip: "Introduce your reader to your research question and topic, explain the importance of your topic and any gaps in the research, and introduce your research question. Don't forget to cite your sources using [in-text citations](https://www.scribbr.com/category/apa-style/)!"
        required: true
      - id: sources
        kind: table
        prompt: "II. Literature review"
        tip: "Background: as you conduct literature review, you will synthesize and summarize themes and its value in your research. Define any terms/[vocabulary](https://www.merriam-webster.com/) that your reader may not know. Cite your sources using [in-text citations](https://www.scribbr.com/category/apa-style/). If it's helpful for your organization, you might want to use this organizer or adapt it to your liking."
        rows:
          - Methods, or why is this source relevant to your research?
          - Findings
          - Limitations
          - Other notes (link the article)
        columns: [Source 1, Source 2, Source 3, Source 4, Source 5]
      - id: beginning
        kind: long
        prompt: Below, include a minimum of a three-paragraph beginning to your literature review. You may provide a detailed outline of the rest of your content.
        required: true
      - id: references
        kind: long
        # A references page hangs (dev-151): each entry's first line at the
        # margin, the rest set in, on the surface and on the page.
        style: hanging
        prompt: "III. References"
        tip: "Properly format your references page and include a minimum of 5 solid sources. See below for a model of formatting. Here is a [citation generator](https://www.scribbr.com/apa-citation-generator/?scr_source=Apa%20Generator%20cta&scr_medium=Scribbr%20services%20cta%20OLD&scr_campaign=Knowledgebase%20alternative%20header&frm=22895). Alphabetize. Notice the spacing and the indentation!"
        required: true
  - id: self
    name: "IV. Self-evaluate on your rubric"
    fields:
      - id: self_eval
        kind: rubric
        prompt: Mark the level you believe you reached on each row
        tip: The same rubric your teacher grades with.
        required: true
      - id: self_score
        kind: number
        prompt: "a) Give yourself an overall score out of 4"
        tip: Between 1 and 4; a score between numbers, such as 3.5, is fine.
        min: 1
        max: 4
        step: 0.01
        required: true
      - id: proud
        kind: long
        prompt: "b) What are you most proud of in terms of the independent research you are conducting?"
        required: true
      - id: growth
        kind: long
        prompt: "c) What are the areas of growth?"
        required: true
  - id: part2
    name: "Part II: to be filled by the family Elder"
    fields:
      - id: elder_note
        kind: note
        text: >-
          **Family Elder Score:** What score would you assign as a researcher in
          the above 2 categories? (4, 3, 2, 1 or something in between). Make a few
          bullet points to help you in explaining the rationale for your score
          through an oral feedback to the researcher. You may find some of these
          [sentence frames](https://drive.google.com/file/d/1KvXXDLxv75ezhtojVu2yLslTTkcYxq6y/view)
          helpful in providing the oral feedback.
      - id: elder_score
        kind: choice
        owner: staff
        prompt: Rating
        options: ["4", "3.5", "3", "2.5", "2", "1.5", "1"]
      - id: elder_rationale
        kind: long
        owner: staff
        prompt: Rationale with evidence
        tip: Bullet points are fine. This is what you say to the researcher in the family; the written line is the record of it.
  - id: part3
    name: "Part III: to be filled by the researcher during the oral feedback"
    fields:
      - id: oral_feedback
        kind: long
        prompt: "Writers, please record the feedback in the space below:"
