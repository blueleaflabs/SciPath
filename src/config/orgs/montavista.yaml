# Tenant one. Domain signup only. Students and staff on separate domains,
# both granting affiliation without a club mentor.
#
# **One file per school, and it is the only place the school is described.**
# These eight facts used to exist twice — here in TypeScript and again as a
# `provision_org` call in migration 0001 — with a comment above them saying
# the two must not be allowed to drift. A rule stated in a comment is not a
# rule (19.9). The application reads this file and `seed-orgs` provisions the
# row from it, so adding a school is a file rather than an edit in two places
# that have to agree.

slug: montavista

# The label this school answers on: montavista.localhost:4321 while
# developing, montavista.scipath.org in production. Only the label is stored,
# because the domain belongs to the deployment and not to the school.
# Omitted where it equals the id, which is the ordinary case.

name: Monta Vista High School
# What the masthead shows. The full name split the bar into two lines.
short_name: Monta Vista
mark: MVHS
theme: proceedings
record_prefix: MVRJ
timezone: America/Los_Angeles

# Closed for the pilot (2.9): the class's accounts were loaded before the
# students arrived, and nobody else — a classmate the link was forwarded
# to, a student at another school with a district address — gets an
# account by signing in. `domain` is the setting to return to when the
# school opens it. SIGNUPS=closed in the deployment closes every tenant at
# once, whatever the file says.
signup_mode: closed
verified_domains: [student.fuhsd.org, fuhsd.org]

# Both domains grant affiliation on their own, which is what `population`
# distinguishes: a student address and a staff address are not the same claim.
domains:
  - { domain: student.fuhsd.org, population: student }
  - { domain: fuhsd.org, population: staff }

address: 21840 McClellan Road, Cupertino, CA 95014
phone: 408.366.7600

contact_email: hello@blueleaflabs.org
editorial_review: true

# **The pilot.** The class is the only thing live, and nothing else has
# been approved. Until the date: the editorial desk, publishing, role
# administration, the assign queue and the public showcase are off the
# bars (the pages still answer at their addresses), and the five programs
# below are seeded as `draft`, so a student sees IRPD and nothing to join.
# The reminder is `tests/orgs.mjs`, which fails the day this date is
# reached; move the date on purpose, or delete a line to open that thing.
# Opening a program on the hosted project is `npm run programs:status --
# <template> open --cloud`, not a reseed (COMMANDS.md).
hidden_until:
  date: 2027-01-15
  # `guides` is the masthead link; `programs` and `past` are the Workbench's
  # Programs and Past seasons sections, off for the pilot and back for the
  # club (2.8).
  surfaces: [editorial, publish, roles, assign, showcase, guides, programs, past]
  programs: [scvsefa-2027, csef-2027, mvhs-scvsefa-2027, grant-mvhs-micro-2027, mvrj-2027]
# **When the class meets, and how the backup pulse is paced (2.8).**
# Live updates arrive over a socket and cost the edge nothing. A browser
# whose socket a network will not carry falls back to polling, and the
# pacing below is that backup's: inside a period it asks every
# `in_class_seconds` while the person is working and every
# `in_class_idle_seconds` once they pause; outside a period, once an hour.
# Times are this school's clock (`timezone` above). Fill the periods in
# from the bell schedule: every meeting of the class, for the year.
#
# The pacing is a dial, and it was turned down before the pilot (2.9):
# every pulse is a database call for the whole class, so sixty seconds
# in class keeps forty browsers on the backup path under one call a
# second between them, and a reply still lands inside a minute.
# `enabled: false` is the off switch — no polling at all, and the strip
# asks the person to reload — for a day the numbers say so.
live:
  class_periods:
    - { days: [Mon, Tue, Wed, Thu, Fri], from: "08:00", to: "15:30" }
  fallback:
    enabled: true
    in_class_seconds: 300
    in_class_idle_seconds: 900
    off_hours_seconds: 3600

# What the front door calls the class (2.9). Without this the first class
# or club in `programs` lent its name, and that was the fair club's.
class_name: IRPD Class

showcase_note: >-
  Work by students at this school, published as a permanent, citable record.

programs:
  # The regional fair, which this school enters rather than runs. Its `org_id`
  # is null and one row serves every school; listing it here says Monta Vista
  # takes part, and is what layers the club's own dates onto it.
  - scvsefa-2027
  # The state fair the regional advances to. Shared like the regional, and
  # listed because Monta Vista has students who advance.
  - csef-2027
  - mvhs-scvsefa-2027
  - irpd-mvhs-2027
  - grant-mvhs-micro-2027
  - mvrj-2027
