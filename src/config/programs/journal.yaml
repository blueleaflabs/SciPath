# The school journal. A program of kind `publication`.
#
# It has editors, an annual turnover, and a confidentiality boundary, and
# those are the only things it needs — which is what a program already is.
# Making it a separate kind of thing would mean a second place roles are
# granted, a second thing that lapses in June, and a second scope for the
# policies to respect.
#
# A submission is a state machine, not a checkpoint, so this has no milestones
# and no deliverables. The model has to tolerate a participation that copies
# nothing, which is equally true of a generic research program with two loose
# deadlines.
#
# **[TODO]** the real values. This is the shape, with the questions and the
# scale lifted out of `src/lib/workflow.ts`, where they currently live in code.

id: mvrj-2027
family: mvrj
kind: publication
name: Monta Vista Research Journal
level: school
season: 2027

has:
  entries: false
  categories: false
  awards: false
  advancement: false
  showcases: false
  milestones: false

# ---------------------------------------------------------------------------
# Who edits.
#
# Staff of any program in these families are editors here, so nobody is
# granted twice and September's job is unchanged: grant the club's officers
# and this follows.
#
# Resolved against whichever edition of that family is CURRENT, not the one a
# paper's work was done in. Papers arrive the summer after the competition and
# the officers who ran that season have graduated.
#
# Naming two families here dissolves the confidentiality boundary between
# them: a fair officer would see IRPD's review comments and the reverse. For a
# small shared editorial board that may be right. It has to be a decision.
# ---------------------------------------------------------------------------
staff_from: [scvsefa]

# Explicit grants still work and win, for a club that wants three of its eight
# officers editing rather than all of them.
allow_explicit_staff: true

roles:
  staff: { singular: Editor, plural: Editors }
  member: { singular: Author, plural: Authors }

# ---------------------------------------------------------------------------
# Review. Currently hardcoded in src/lib/workflow.ts, and template-shaped:
# a proceedings for design-research showcases would ask different questions
# than a science journal does.
# ---------------------------------------------------------------------------
review:
  rounds: unlimited          # what ends it is the editor deciding
  blind: single              # the reviewer sees the byline; the author never
                             # sees the reviewer. 8.6.

  scale: [no, partly, mostly, yes]

  questions:
    - id: question_clear
      text: Is the question clear enough to answer?
    - id: methods_repeatable
      text: Could somebody else repeat this from the methods alone?
    - id: results_supported
      text: Do the results follow from the data shown?
    - id: limits_honest
      text: Are the limitations stated honestly?
    - id: prior_work
      text: Is the prior work represented fairly?
    - id: writing_clear
      text: Is it written clearly enough for somebody outside the field?

  recommendations:
    - { id: accept, label: Accept }
    - { id: minor, label: Accept after minor revisions }
    - { id: major, label: Major revisions needed }
    - { id: decline, label: Decline }

# ---------------------------------------------------------------------------
# What it publishes.
# ---------------------------------------------------------------------------
publishes:
  record_kind: article
  prefix: MVRJ
  license_default: CC BY 4.0
  structure: scientific-paper     # which rule set the write-up is checked
                                  # against. **[DECIDE]** open item 56.

# Which programs may submit here. A venue may serve several, which is what
# lets a fair project and a class project reach one school archive.
accepts_from: [scvsefa, irpd]
