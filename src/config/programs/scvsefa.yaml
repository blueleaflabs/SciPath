# The Synopsys Championship, run by SCVSEFA, which is the fair Monta Vista
# students actually enter.
#
# Inherits everything from ISEF and changes what is local: the dates, the
# subset of categories it runs, its own paperwork, and where its winners go.
#
# The dates below are the season's real dates, read off the fair's page by a
# person once a year. Everything else is expressed relative to one of them, so
# when the fair moves — and it does — the rest moves with it.

id: scvsefa-2027

# The key that groups editions. `scvsefa-2027` and `scvsefa-2028` share it, so
# this year's officers see the club's history and IRPD's elders do not.
#
# A string, not an object. There is no parent row and nothing hangs off it: a
# family with staff is the seasons model coming back through the side door.
#
# The risk is a typo silently starting a new lineage, so a family must either
# already exist at this school or be declared explicitly as new.
family: scvsefa

extends: isef
name: Synopsys Silicon Valley Science and Technology Championship
authority: Santa Clara Valley Science and Engineering Fair Association
level: regional
season: 2027

kind: competition

# Where work from this program gets published, if anywhere. A venue is itself
# a program, of kind publication, and may serve several.
publishes_to: mvrj

# ---------------------------------------------------------------------------
# The anchors. Real dates, entered by hand.
#
# **[VERIFY]** every one of these against the fair's published calendar before
# a season is run against it. They are placeholders shaped like the real
# thing, not the real thing.
# ---------------------------------------------------------------------------
anchors:
  fair: 2027-03-10
  registration_opens: 2027-01-05
  registration_closes: 2027-02-05
  src_review: 2027-01-20

# ---------------------------------------------------------------------------
# Local paperwork, on top of what ISEF requires.
# ---------------------------------------------------------------------------
forms:
  add:
    - id: scvsefa_entry
      name: Championship entry form
      signed_by: [student, adult_sponsor]
      blocks: registration

    - id: photo_release
      name: Photography and publication release
      signed_by: [student, parent]
      blocks: competition
      note: >-
        Optional in the sense that a student may decline it. Declining means
        the fair does not photograph them, not that they cannot compete.

limits:
  # Tighter than ISEF's, which is the usual direction for a regional fair.
  abstract_words: 250

# ---------------------------------------------------------------------------
# Milestones. `on` is a real date; `relative` is an offset from an anchor.
# Both are accepted anywhere, and a date that is not yet published is simply
# absent, which the interface shows as pending rather than inventing one.
# ---------------------------------------------------------------------------
milestones:
  add:
    - id: src_packet
      name: Paperwork to the review committee
      gate: experimentation
      relative: { anchor: src_review, days: -14 }
      note: The committee reads it before it meets, not at the meeting.

    - id: judging
      name: Judging day
      relative: { anchor: fair, days: 0 }

    - id: setup
      name: Board setup
      relative: { anchor: fair, days: -1 }

    - id: results
      name: Results announced
      relative: { anchor: fair, days: 1 }

  override:
    - id: register
      relative: { anchor: registration_closes, days: -7 }
      note: A week before the fair closes registration, not on the day.

    - id: abstract_due
      relative: { anchor: registration_closes, days: 0 }

# The categories this fair does not run.
categories:
  remove: [TMED, CBIO]

advances_to:
  - program: csef
    label: California Science and Engineering Fair
  - program: isef
    label: ISEF
    note: >-
      **[VERIFY]** the mechanism and quota. Confirm against current rules
      rather than encoding from memory.
