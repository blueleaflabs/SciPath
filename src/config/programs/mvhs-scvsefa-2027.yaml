# Monta Vista Research Club, 2027 season.
#
# The club's job is the part the fair does not supervise. The fair wants a
# plan in November and an abstract in February and asks for nothing in
# between, so most of what follows sits in `work` and `start`.
#
# Nothing here is a rule of the fair, and every step says so. A student who
# confuses the two starts treating real deadlines as advisory, and the fair's
# November date is one where that ends a season.

id: mvhs-scvsefa-2027

# Who read the source this is built from, what they read, and when. A year
# after `verified_on` the program's advisor is told: a rulebook and a school
# calendar both change annually, and a file nobody has looked at since last
# season looks exactly like one checked this morning.
provenance:
  owner: Rohan Agarwal
  source_url: https://scvsefa.org/
  rules_year: 2027
  verified_on: 2026-09-30
  changes:
    - on: 2026-08-22
      what: First reading, against the club's own calendar.
    - on: 2026-09-30
      what: >-
        The school's own selection added (dev-167): the fair limits how
        many projects Monta Vista may enter in 2027 and counts the class's
        and the club's projects inside that limit, so the school selects,
        from everything submitted by October 23, the projects that go in.
        The step's guidance says only what is known; the school's published
        criteria are to be written onto it, verbatim, once they are in hand.
        Then, the same day: the selection announced on October 27 as a step
        of its own; the sponsor ask moved to October 31, after it; joining
        opened, since every account at the club's tenant is a member.


# The research club. A teacher advisor and student officers, and
# deadlines derived entirely from the fair it prepares for. No process of
# its own: the club exists for SCVSEFA.
role: cohort

# What this cohort prepares its members for.
#
# The club's internal deadlines are offsets from the fair's anchors, and they
# resolve **from the opportunity directly** rather than through a member's
# entry. A student who works all year and is not selected still needs the
# calendar they were working toward: resolving through an entry would leave
# them with no dates at all until the moment they were told no (22.6).
prepares_for: scvsefa-2027
family: scvsefa
extends: scvsefa-2027
level: school
season: 2027
# The club has a signup. Not a selection: an officer is confirming that
# somebody turned up and means it, which is a smaller thing than a class with
# thirty places and still worth having a name against.
# Open (dev-167): the club's tenant is the club, and every account made
# there joins on the way in (mvrj.yaml, `auto_join`). Was `approval`.
joining: open

version: 2

uses:
  deliverables: [deliverables-common]
name: Monta Vista Research Club, 2027

roles:
  staff: { singular: Officer, plural: Officers }
  member: { singular: Student, plural: Students }

steps:
  add:
    # The school's selection (dev-167). The fair's 2027 rules give each
    # school a limit on the projects it may enter and count a research
    # class's and a science club's projects inside it; more projects want
    # in than the limit allows, so the school chooses. An absolute date,
    # the school's own, not an offset from the fair's.
    - id: school_selection
      name: Project submitted to MVRC for consideration
      phase: design
      order: 33
      internal: true
      owner: student
      due: { on: 2026-10-23 }
      consequence: blocks_registration
      deliverables:
        - { ref: research_plan }
      note: >-
        Monta Vista may enter a limited number of projects in the 2027
        Championship, and every project from the class and the club counts
        against that limit. Everything in by this date is read against the
        club's published selection criteria; only the projects selected go
        on to register. Not a rule of the fair: the school's own.
      risk: >-
        A plan that is still a topic on this date is not read as a plan.
        Be concrete about the question, the method and what will be
        measured; that is what the selection reads.

    - id: selection_announced
      name: Selected projects announced
      phase: design
      order: 34
      internal: true
      owner: program
      consequence: none
      due: { on: 2026-10-27 }
      deliverables: []
      note: >-
        The projects going to the 2027 Championship under Monta Vista's
        limit are named. A project not selected keeps its work and its
        journal path; it does not register for the fair.

    - id: club_topic
      name: Settle the question with an officer
      phase: topic
      order: 12
      internal: true
      owner: student
      due: { anchor: applications_open, days: 7 }
      deliverables:
        - { ref: question }

    - id: club_lit_review
      name: Literature review read by an officer
      phase: literature
      order: 22
      internal: true
      owner: staff
      requires: [literature]
      # After the topic is settled, which it was not: this was due a week
      # before the conversation that chooses what to read about.
      due: { anchor: src_early, days: -21 }
      deliverables:
        - { ref: literature_review }

    - id: club_sponsor
      name: Ask a teacher to sponsor
      phase: forms
      order: 55
      internal: true
      owner: student
      # October 31 (dev-167), an absolute date, from three weeks before the
      # fair's early SRC date (which was October 12): after the selection,
      # not before it.
      due: { on: 2026-10-31 }
      risk: >-
        A week of silence is normal and not a refusal. Two weeks means ask
        somebody else. Start before the plan is finished: the sponsor has to
        read it, and finding one in the last week is how a project misses
        November.

    - id: club_plan_review
      name: Research plan read by an officer
      phase: design
      order: 32
      internal: true
      owner: staff
      requires: [design]
      due: { anchor: src_early, days: -14 }
      deliverables:
        - { ref: research_plan }

    - id: club_packet_check
      name: Paperwork checked by an officer before it goes in
      phase: forms
      # Before the fair's deadline, which is what the step is for. It was
      # numbered after it: the name said one thing and the order said another,
      # and a student reading the list in order would have seen the check
      # after the thing it checks.
      order: 54
      internal: true
      owner: staff
      requires: [approvals_before_work]
      due: { anchor: src_early, days: -7 }
      note: >-
        A week before the fair's early date. Applications are read in the
        order received, so being early is worth something real.

    # The two steps the fair leaves empty. This is the club's whole purpose.
    - id: club_collect_checkin
      name: Data collection check-in
      phase: experiment
      order: 62
      internal: true
      owner: staff
      repeats: { every: 3_weeks, until: { anchor: abstracts_close, days: -28 } }
      note: >-
        The fair asks nothing between November and February. Somebody should,
        and it is cheaper to find out in December that the apparatus never
        worked than in February.

    - id: club_analysis_review
      name: Analysis reviewed with an officer
      phase: analysis
      order: 72
      internal: true
      owner: staff
      requires: [analyse]
      due: { anchor: abstracts_close, days: -28 }

    - id: club_abstract_draft
      name: Abstract drafted and read
      phase: conclusions
      order: 81
      internal: true
      owner: student
      due: { anchor: abstracts_close, days: -14 }
      deliverables:
        - { ref: abstract }

    - id: club_board_check
      name: Board measured against the size limit
      phase: conclusions
      order: 87
      internal: true
      owner: student
      due: { anchor: check_in, days: -5 }
      note: 122 cm wide, 76 cm deep, 274 cm tall, standing on the table.

    - id: club_practice
      name: Practice judging
      phase: conclusions
      # Before the board goes in, not after: the point of practising is to
      # find out what is missing from the board while there is still time to
      # change it. It was ordered after check-in and dated before it, which
      # the validator caught.
      order: 86
      internal: true
      owner: staff
      due: { anchor: fair, days: -10 }
