# Interdisciplinary Research and Project Design, 2026-27.
#
# ── Dates are absolute here ─────────────────────────
#
# Some templates express a deadline as an offset from an anchor, so that
# moving one date moves the rest. This is a class calendar with actual dates.
#

id: irpd-mvhs-2027

provenance:
  owner: Rohan Agarwal
  source_url: https://irpdelders.wixsite.com/
  rules_year: 2027
  verified_on: 2026-09-02
  changes:
    - on: 2026-08-22
      what: First reading, against the class roadmap and the semester calendar.
    - on: 2026-09-02
      what: >-
        Second reading of the semester calendar, line by line, before the
        pilot. Every existing date held. Four steps added, all inside the
        September window, all of them things the calendar states a student
        hands in and this file had folded into a later step: the literature
        review turned in for family feedback on the 3rd, the interview
        protocol handout on the 15th, the journey map first draft on the
        15th, and the elders' feedback on the literature reviews on the 14th.
    - on: 2026-09-04
      what: >-
        The literature review moved from the 14th to the 8th, so it is open
        on the pilot's first day. The class rubric from the literature review
        template put on the step. The five September deliverables given
        shapes and written in SciPath.
    - on: 2026-09-06
      what: >-
        Cleaned up for the pilot: impact and feasibility, the weekly journal
        step, the list of users and the interview questions (with the
        Elder's reading of them) removed; steps renamed to the class's own
        words (Green sheet, Lit Review v1 and v2, Journey Map v1, Elder
        Feedback: Lit Review); the research question and graphic on the
        10th, the journey map's first draft on the 17th; the sequence made
        chronological across the phases.

# ── Free text on deliverables and steps, and where each shows ──────────────
#
# Three keys carry prose. Each is left as "" where nothing is written; put
# text in place of the quotes (a long paragraph goes as `>-` on its own
# line with the text indented beneath it).
#
#   deliverables[].guidance   Under the deliverable's name in the Deadlines
#                             row on the project page, and as the line under
#                             the row on the Workbench plate. What the thing
#                             is and what a good one has.
#   steps[].risk              Behind "Where this usually goes wrong" on the
#                             Deadlines row. The mistake students make here.
#   steps[].note              Only as the Workbench plate's line when the
#                             step's deliverables have no guidance and the
#                             step has no risk. Background for the reader,
#                             not shown on the project page.
#

family: irpd
kind: course

# A class. A teacher, student elders, a roster, its own process
# and its own anchors. What it prepares for is its own showcase.
role: cohort

# No `prepares_for`. The Community Showcase was briefly lifted out as an
# opportunity of its own, on the reasoning that a student can say "I presented
# at the IRPD Community Showcase" two years later. It is going back where it
# was: it is a milestone of this class, run by this class, on a day this class
# sets, and a separate template duplicated the step rather than moving it.
#
# If a showcase ever needs a record of its own, milestone 6 is where it comes
# from and the template does not have to exist first.

name: IRPD
short_name: IRPD
authority: Monta Vista High School
level: school
season: 2027
version: 4

uses:
  deliverables: [deliverables-common]
url: https://irpdelders.wixsite.com/irpd/
location: Room A112
publishes_to: mvrj

# The teachers are not named here. This file is public; the class roster,
# the teachers included, is loaded from `local-data/pilot-irpd.yaml` by
# `npm run pilot:load`, which gives them the advisor role and makes them the
# sponsors of every project in the class. Nothing reads a `teachers` key
# from a template.

roles:
  staff: { singular: Elder, plural: Elders }
  member: { singular: Student, plural: Students }
  staff_note: Returning student leaders selected by the instructors.

has:
  entries: false
  categories: false
  awards: false
  advancement: false

process: own

facts:
  - { id: humans, question: "Will you interview or survey anybody?" }
  - { id: minors, question: "Are any of them under 18?" }

# ── The roadmap's six milestones, in the roadmap's order ───────────────────
#
# The roadmap groups these under three phases — Research (01-03), Design
# (04), Impact (05-06) — and the model has one level of grouping rather than
# two. Six is the level that helps: a student asking "where am I" is asking
# which of the six, and the three are visible in the names.
#
# The windows are the months the calendar spends on each, which is what a
# step with no published day of its own resolves to.
#
# The ids are prefixed rather than named `topic` and `design`, which is not
# cosmetic: `process-science` declares phases and steps by those names, and a
# project in this class that is also entered at a fair resolves both. Two
# phases with one id merge into one heading, and a student sees the class's
# journey map filed under the fair's idea of design.
phases:
  - { id: irpd_topic,     name: "Research topic",             window: { from: august,    to: september } }
  - { id: irpd_empathy,   name: "Lit Review", window: { from: august,    to: september } }
  - { id: irpd_question,  name: "Interviews",        window: { from: august,    to: september } }
  - { id: irpd_design,    name: "Project design",                 window: { from: september, to: october } }
  - { id: irpd_impact,    name: "Implementation",               window: { from: october,   to: november } }
  - { id: irpd_scaling,   name: "Scaling",                     window: { from: november,  to: april } }

joining: approval
places: 40

# The class shows its work to itself. Every project appears on the IRPD
# Showcase, live, to the class's members and staff and to nobody else, and
# nothing from the class becomes a public record while this stands. A
# student may take their own card off the page and put it back whenever
# they like.
showcase: private
# The teachers are the sponsors and the roster comes from the class list;
# students see the people on their project and do not change them.
people: staff

# ── When a milestone starts being mentioned ────────────────────────────────
#
# A window, not a schedule: nothing is queued, so there is nothing to cancel
# when a milestone is met. The step simply stops appearing in the digest.
#
# These override the platform floor in src/lib/template-resolve.ts, which is
# five days for a step with no consequence. Five days is right for a fair
# deadline that mostly confirms paperwork and wrong for a class milestone
# with weeks of work behind it.
#
# Shorter than they were, now that the dates are real. Seventy five days was
# set while every step resolved to the end of a month; against a published
# day, a fortnight's notice on a worksheet is a reminder and a month is
# noise. The one that blocks work keeps a month, because finding a guardian
# to sign a consent form takes longer than finding a worksheet.
notify_default:
  none:                      { from: 14, urgent: 3 }
  blocks_human_participants: { from: 30, urgent: 14 }

anchors:
  course_start: 2026-08-17
  # Thursday, per the calendar. This read 2026-11-06, which is a Friday and
  # not a day this class meets.
  feedback_session: 2026-11-05
  community_showcase: 2027-04-25

anchor_specs:
  - { id: course_start, label: First day of the course, required: true }
  - { id: feedback_session, label: Feedback session }
  - { id: community_showcase, label: Mountain View Library showcase }

# ── What is handed in ──────────────────────────────────────────────────────
#
# Named as the class names them, because a student looking for "narrowing
# down your research topic" in their folder should find the same words here.
#
# `question`, `literature_review`, `research_plan` and `project_site` are
# declared in `deliverables-common` and are overridden rather than renamed,
# so that the research club's steps, which reference the shared ids, still
# point at the same artifact. One document satisfying two calendars is 6.8,
# and it works only while the id is the same in both.
# `template_url` on any of these is the class's own template as a copy link
# (a Google Doc's address with `/copy` in place of `/edit`). The row then
# offers "Start from the class template", the student gets their own copy
# in their Drive, and records its address back here. Fill them in as the
# teachers share the documents.
deliverables:
  - { id: green_sheet, name: Green Sheet, kind: form, owner: student, requirement: required, shape: drive-link }
  - { id: project_idea, name: Project Idea Form, kind: text, owner: student, requirement: required, shape: impact-feasibility }
  - { id: top_strengths, name: Top 3 Strengths, kind: form, owner: student, requirement: required, shape: drive-link }
  - { id: topic_narrowing, name: Narrow Down the Research Topic, kind: link, owner: student, requirement: required, shape: drive-link }
  # Written in SciPath from a shape (6.16): the row opens the document,
  # the Elder reads it there, and Submit records it.
  - { id: interview_protocol_handout, name: Interview Protocol, kind: text, owner: student, requirement: required, shape: interview-protocol }
  # One page for the interviews (2.8): the Drive folder with the signed
  # consent forms and the write-up of what was heard.
  - { id: interview_synthesis, name: Empathy Interviews, kind: link, owner: student, requirement: required, shape: drive-link }

  - id: question
    name: Research Question
    kind: text
    owner: student
    requirement: required
    shape: research-question
    guidance: ""

  - id: literature_review
    name: Lit Review v2
    kind: text
    owner: student
    requirement: required
    shape: literature-review
    guidance: ""

  # Its own id rather than a second reference to `literature_review`, because
  # a step and its draft that share a deliverable share a completion: record
  # the draft and the final reads as met. The draft is a real turn-in with a
  # real date and it is not the same claim as the finished review.
  - id: literature_review_draft
    name: Lit Review v1
    kind: link
    owner: student
    requirement: required
    shape: drive-link
    guidance: ""

  # Renamed Research Graphic on September 7 (the four boxes and the picture
  # drawn from them); the id stays, and the showcase's "Use my Research
  # Graphic" reads it by that id.
  - { id: project_summary, name: Research Graphic, kind: text, owner: student, requirement: required, shape: project-summary }
  # One document for both journey map deadlines (2.8): the draft is
  # uploaded on the first, updated and submitted again on the second.
  - { id: journey_map, name: Journey Map, kind: file, owner: student, requirement: required, shape: journey-map }
  - { id: wbs, name: Work Breakdown Structure, kind: link, owner: student, requirement: required, shape: drive-link }
  - { id: oral_pitch, name: Two Minute Oral Pitch, kind: link, owner: student, requirement: required, shape: drive-link }

  - id: research_plan
    name: Project Plan
    kind: link
    owner: student
    requirement: required
    shape: drive-link
    guidance: ""

  - { id: grants_scan, name: Grants and Competitions to Apply For, kind: link, owner: student, requirement: required, shape: drive-link }
  - { id: prototype_plan, name: Prototype Implementation and Testing Plan, kind: link, owner: student, requirement: required, shape: drive-link }
  - { id: journey_map_2, name: Journey Map 2.0, kind: link, owner: student, requirement: required, shape: drive-link }
  - { id: project_presentation, name: Project Presentation to the Class, kind: link, owner: student, requirement: required, shape: drive-link }
  - { id: lessons_learned, name: Lessons Learned, kind: link, owner: student, requirement: required, shape: drive-link }

  - id: project_site
    name: Researcher Profile
    kind: link
    owner: student
    requirement: required
    shape: drive-link
    guidance: ""

  - { id: showcase_presentation, name: Showcase Presentation, kind: link, owner: student, requirement: required, shape: drive-link }
  # Steps with nothing to hand in: one page and one verb like every other
  # (2.8), the day it was done as the record.
  - { id: researcher_profile_draft_done, name: First Draft of the Researcher Profile, kind: text, owner: student, requirement: required, shape: mark-done }
  - { id: feedback_session_done, name: Feedback Session, kind: text, owner: student, requirement: required, shape: mark-done }
  - { id: nsta_done, name: Present at the NSTA Conference, kind: text, owner: student, requirement: optional, shape: mark-done }
  - { id: grants_applications_done, name: Apply for the Grants and Competitions, kind: text, owner: student, requirement: optional, shape: mark-done }
  - { id: exploravision_done, name: ExploraVision Entry, kind: text, owner: student, requirement: optional, shape: mark-done }
  - { id: sigma_xi_done, name: Sigma Xi Virtual Research Showcase, kind: text, owner: student, requirement: optional, shape: mark-done }
  - { id: quest_fair_done, name: Quest Innovation Fair, kind: text, owner: student, requirement: optional, shape: mark-done }

  - id: manuscript
    name: The Write-Up
    kind: link
    owner: student
    requirement: optional
    shape: design-research

steps:
  # The sequence is chronological across the phases (2.8): `order` runs
  # with the dates, and a step sits in the phase whose name says what it
  # is, even where two phases share a month.

  # ── 01 Research topic ────────────────────────────────────────────────────
  - id: green_sheet
    name: Green Sheet
    phase: irpd_topic
    order: 10
    owner: student
    due: { on: 2026-08-18 }
    deliverables:
      - { ref: green_sheet }

  - id: project_idea
    name: Project Idea Form
    phase: irpd_topic
    order: 20
    owner: student
    due: { on: 2026-08-19 }
    # On the class tracker (2.8): the family's score, out of 4.
    tracker: { column: true }
    deliverables:
      - { ref: project_idea }

  - id: strengths
    name: Top 3 Strengths
    phase: irpd_topic
    order: 25
    owner: student
    due: { on: 2026-08-24 }
    tracker: { column: true }
    deliverables:
      - { ref: top_strengths }

  - id: topic_narrowing
    name: Narrow Down the Research Topic
    phase: irpd_topic
    order: 30
    owner: student
    due: { on: 2026-08-27 }
    requires: [project_idea]
    tracker: { column: true }
    deliverables:
      - { ref: topic_narrowing }
    note: ""

  # ── 02 Lit Review and Research Question ──────────────────────────────────
  - id: literature_review_draft
    name: Lit Review v1
    phase: irpd_empathy
    order: 10
    owner: student
    due: { on: 2026-09-03 }
    tracker: { column: true }
    deliverables:
      - { ref: literature_review_draft }
    note: ""

  - id: literature_review
    name: Lit Review v2
    phase: irpd_empathy
    # After the graphic and the question in the sequence (order 45), since
    # it is due after them now; the guard in tests/templates.mjs holds the
    # sequence and the dates to the same order.
    order: 45
    owner: student
    # Moved from the 14th on September 4, so the review is open when the
    # pilot starts; to the 11th on September 10, the day after the class
    # first signs in. The Elders' reading of it keeps the 14th.
    due: { on: 2026-09-11 }
    requires: [literature_review_draft]
    # The one column whose score and comment the student sees (the
    # teacher's call, September 2026); every other column waits on the
    # platform switch.
    tracker: { column: true, students: true }
    deliverables:
      - { ref: literature_review }
    note: ""
    # The class's own rubric, from the literature review template: four
    # levels, an overall score out of 4 (the mean of the rows chosen, so a
    # 3.5 is a real score), the same grid the student self-evaluates on
    # inside the document. A criterion with a level missing in the handout
    # has that level missing here.
    rubric:
      scoring: average
      criteria:
        - id: question
          name: Research question
          levels:
            - { id: exemplary, label: Exemplary, points: 4, description: "Research question is clear, focused, and realistic." }
            - { id: accomplished, label: Accomplished, points: 3, description: "Research question is generally clear, focused, and realistic." }
            - { id: developing, label: Developing, points: 2, description: "Includes a research question." }
            - { id: beginning, label: Beginning, points: 1, description: "Has a research topic." }
        - id: introduction
          name: Introduction
          levels:
            - { id: exemplary, label: Exemplary, points: 4, description: "Grabs the reader's attention. Includes problem statement or importance of topic. If appropriate, it includes the gap in the research. Includes research question. Writing is clear and well-organized." }
            - { id: accomplished, label: Accomplished, points: 3, description: "Includes problem statement or importance of topic. If appropriate, it includes the gap in the research. Includes research question. Writing is generally clear and well-organized." }
            - { id: developing, label: Developing, points: 2, description: "Introduces research question, with some context." }
            - { id: beginning, label: Beginning, points: 1, description: "Introduces research question." }
        - id: background
          name: Background and literature review
          levels:
            - { id: exemplary, label: Exemplary, points: 4, description: "Includes thorough background information in the field. Background information informs the research question. Defines key terms. Writing is clear and well-organized." }
            - { id: accomplished, label: Accomplished, points: 3, description: "Includes background information in the field. Background information informs the research question. Defines key terms. Writing is generally clear and well-organized." }
            - { id: developing, label: Developing, points: 2, description: "Includes some background information in the field. In general, the background information informs the research." }
            - { id: beginning, label: Beginning, points: 1, description: "Includes some background information in the field." }
        - id: corner
          name: Looking around the corner
          levels:
            - { id: exemplary, label: Exemplary, points: 4, description: "Clear, thorough, and complete." }
            - { id: accomplished, label: Accomplished, points: 3, description: "Clear and complete." }
            - { id: beginning, label: Beginning, points: 1, description: "Complete." }
        - id: audience
          name: Audience
          levels:
            - { id: exemplary, label: Exemplary, points: 4, description: "Written for an educated, curious, academic reader who only knows a little about the topic." }
            - { id: accomplished, label: Accomplished, points: 3, description: "With a few exceptions, written for an educated, curious, academic reader who only knows a little about the topic." }
            - { id: beginning, label: Beginning, points: 1, description: "Too informal and simplistic, or so academic the writing is difficult to understand for anyone who is not an expert." }
        - id: citations
          name: In-text citations
          levels:
            - { id: exemplary, label: Exemplary, points: 4, description: "All information properly cited." }
            - { id: accomplished, label: Accomplished, points: 3, description: "All information cited, with a few mechanical errors." }
            - { id: developing, label: Developing, points: 2, description: "Some information cited, with some mechanical errors." }
            - { id: beginning, label: Beginning, points: 1, description: "Information not cited." }
        - id: references
          name: Reference page
          levels:
            - { id: exemplary, label: Exemplary, points: 4, description: "Properly formatted reference page: titled, double spaced, alphabetized, hanging indents, citations in proper form." }
            - { id: developing, label: Developing, points: 2, description: "Some formatting errors in the reference page." }
            - { id: beginning, label: Beginning, points: 1, description: "Only the URLs included." }
        - id: mechanics
          name: Mechanics
          guidance: This does not have to be perfect this round.
          levels:
            - { id: exemplary, label: Exemplary, points: 4, description: "Spellcheck and grammar check run, and perhaps somebody checked the paper." }
            - { id: developing, label: Developing, points: 2, description: "Mechanical errors detract from the reading experience." }
            - { id: beginning, label: Beginning, points: 1, description: "Mechanical errors make the paper difficult to understand." }

  # The worksheet with self-reflection left the calendar on September 7,
  # at the teacher's word; its shape stays on file.
  - id: project_summary
    name: Research Graphic
    phase: irpd_empathy
    order: 30
    owner: student
    due: { on: 2026-09-10 }
    deliverables:
      - { ref: project_summary }

  - id: research_question
    name: Research Question
    phase: irpd_empathy
    order: 40
    owner: student
    due: { on: 2026-09-10 }
    requires: [topic_narrowing]
    deliverables:
      - { ref: question }

  # The Elder's task. `owner: staff` makes a step the Elder's rather than
  # the student's: it sits on the project's calendar so the student can see
  # feedback is coming, and on no student surface as something they owe.
  # `requires` names the student step it waits on; `feedback_on` the
  # deliverable the feedback is written on. The Elder fills their part of
  # that document (the rating, the rationale) and presses "Give the
  # feedback" under it (2.9): that completes the task, puts the rating on
  # the tracker as the family's score, and tells the researcher. A comment
  # on the whole document does the same; a reply in a field's thread is a
  # reply and leaves the task open.
  - id: elder_literature_review_feedback
    name: "Elder Feedback: Lit Review"
    phase: irpd_empathy
    order: 50
    owner: staff
    due: { on: 2026-09-14 }
    requires: [literature_review]
    feedback_on: literature_review
    note: ""

  # ── 03 Interviews ────────────────────────────────────────────────────────
  - id: interview_protocol_handout
    name: Interview Protocol
    phase: irpd_question
    order: 10
    owner: student
    due: { on: 2026-09-14 }
    deliverables:
      - { ref: interview_protocol_handout }

  - id: interviews
    name: Empathy Interviews
    phase: irpd_question
    order: 20
    owner: student
    requires: [interview_protocol_handout]
    consequence: blocks_human_participants
    applies_when: humans
    deliverables:
      - { ref: interview_synthesis }
    risk: ""

  # ── 04 Project design ────────────────────────────────────────────────────
  # The first draft is made on binder paper in class and read by the
  # family the same period; a photo of it goes on the journey map page,
  # which is the same page the final is submitted from a week later.
  - id: journey_map_draft
    name: "Journey Map - First Draft, Binder Paper"
    phase: irpd_design
    order: 10
    owner: student
    due: { on: 2026-09-17 }
    deliverables:
      - { ref: journey_map }

  - id: elder_journey_map_feedback
    name: "Elder Feedback: Journey Map - First Draft"
    phase: irpd_design
    order: 15
    owner: staff
    due: { on: 2026-09-17 }
    requires: [journey_map_draft]
    feedback_on: journey_map

  - id: journey_map
    name: Journey Map
    phase: irpd_design
    order: 20
    owner: student
    due: { on: 2026-09-24 }
    requires: [elder_journey_map_feedback]
    deliverables:
      - { ref: journey_map }

  # Waits on the journey map: a pitch is made from the design, so an Elder
  # with nothing to read had this open from the first day of the class.
  - id: elder_pitch_help
    name: Help the Family Prepare Their Two Minute Pitches
    phase: irpd_design
    order: 30
    owner: staff
    due: { on: 2026-09-28 }
    requires: [journey_map]

  - id: oral_pitch
    name: Two Minute Oral Pitch
    phase: irpd_design
    order: 40
    owner: student
    due: { on: 2026-09-29 }
    requires: [journey_map]
    deliverables:
      - { ref: oral_pitch }

  - id: wbs
    name: Work Breakdown Structure
    phase: irpd_design
    order: 50
    owner: student
    due: { on: 2026-09-30 }
    requires: [journey_map]
    deliverables:
      - { ref: wbs }

  - id: project_plan
    name: Project Plan
    phase: irpd_design
    order: 60
    owner: student
    due: { on: 2026-10-06 }
    requires: [wbs, journey_map]
    deliverables:
      - { ref: research_plan }

  # ── 05 Implementation ────────────────────────────────────────────────────
  - id: grants_scan
    name: Grants and Competitions to Apply For
    phase: irpd_impact
    order: 10
    owner: student
    due: { on: 2026-10-06 }
    requires: [journey_map]
    deliverables:
      - { ref: grants_scan }

  - id: prototype_plan
    name: Prototype Implementation and Testing Plan
    phase: irpd_impact
    order: 20
    owner: student
    due: { on: 2026-10-08 }
    requires: [project_plan, journey_map]
    deliverables:
      - { ref: prototype_plan }

  - id: researcher_profile_draft
    name: First Draft of the Researcher Profile
    phase: irpd_impact
    order: 30
    owner: student
    due: { on: 2026-10-15 }
    requires: [journey_map]
    deliverables:
      - { ref: researcher_profile_draft_done }

  - id: journey_map_2
    name: Journey Map 2.0
    phase: irpd_impact
    order: 40
    owner: student
    due: { on: 2026-10-20 }
    requires: [journey_map]
    deliverables:
      - { ref: journey_map_2 }

  - id: project_presentation
    name: Project Presentation to the Class
    phase: irpd_impact
    order: 50
    owner: student
    due: { on: 2026-10-29 }
    requires: [prototype_plan, journey_map]
    deliverables:
      - { ref: project_presentation }

  - id: feedback_session
    name: Feedback Session
    phase: irpd_impact
    order: 60
    owner: student
    due: { anchor: feedback_session, days: 0 }
    requires: [journey_map]
    review: formative
    note: ""
    deliverables:
      - { ref: feedback_session_done }

  # ── 06 Scaling ───────────────────────────────────────────────────────────
  - id: nsta
    name: Present at the NSTA Conference
    phase: irpd_scaling
    order: 10
    owner: student
    due: { on: 2026-11-10 }
    requires: [journey_map]
    requirement: optional
    deliverables:
      - { ref: nsta_done }

  - id: grants_applications
