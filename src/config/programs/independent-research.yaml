# Research on your own.
#
# The program for somebody who is not in a class and has not joined a club,
# which is most students. It exists because the alternative is a student
# looking at a list of things they cannot join and closing the tab, and
# because a project has to be able to exist before anybody has decided
# anything about it.
#
# It asks for nothing and refuses nobody. No deadlines, because no
# institution has set any; no staff, because nobody is overseeing it; no
# showcase, because there is nothing to be selected for. What it has is the
# research process, which is the part that is the same everywhere.
#
# A project started here can be entered at a fair later without being
# recreated: participations are separate from the project, which is what that
# separation was for.

id: independent-research
family: independent
kind: independent

# ── Scheduled for removal, and not yet ─────────────────────────────────────
#
# 22.10 deletes this. It provides a row to join and a process, and the
# process is the whole of the scaffolding: once a project carries its own
# `process_id`, a solo student gets all eleven steps by a shorter path and
# what goes is a fictional membership in an organization with no members.
#
# **The deletion depends on that column existing.** Removing the program
# first would take the scaffolding away rather than relocate it, and would
# leave the Open Program tenant with nothing at all. So it stays until the
# schema lands, marked so nobody mistakes it for an oversight.
#
# It has no `role`, deliberately. It is neither a cohort — no teacher, no
# mentors, nobody answerable — nor an opportunity, since nothing is entered
# and no record comes out. That it cannot be classified is the argument for
# deleting it.
role: none

name: Independent research
level: school
version: 1

# Anybody, immediately. The one program in this repository where that is
# true, and the reason it exists.
joining: open

process: science

uses:
  deliverables: [deliverables-common]
  shapes: [imrad, abstract]

has:
  entries: false
  categories: false
  awards: false
  advancement: false
  showcase: false

roles:
  member: { singular: Researcher, plural: Researchers }

# No anchors. Nothing here has a date because nobody has set one, and
# inventing a calendar for somebody working alone would be the software
# pretending to an authority it does not have.
anchors: {}

guidance: >-
  The process, without a deadline attached to any of it. Work at whatever
  pace the work takes. If you enter this at a fair later, the fair's dates
  arrive with the entry and nothing you have done has to be redone.
