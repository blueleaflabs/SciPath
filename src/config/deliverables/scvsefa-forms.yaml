# SCVSEFA's own paperwork, on top of ISEF's.
# Read off science-fair.org on 2026-08-06.

id: deliverables-scvsefa

deliverables:
  - id: permission_hold_harmless
    name: Student Permission and Hold Harmless Agreement
    kind: form
    owner: student
    requirement: required
    per: member
    signed_by: [student, parent]
    before_work: true
    url: https://science-fair.org/wp/wp-content/uploads/2023/07/Student-Permission-Hold-Harmless.pdf

  - id: media_release
    name: Photo, Video, Website and Media Release
    kind: form
    owner: student
    requirement: required
    per: member
    signed_by: [student, parent]
    url: https://science-fair.org/wp/wp-content/uploads/2024/08/Media-Release.pdf
    guidance: >-
      Required rather than optional. A student who will not sign it cannot
      enter, which is worth knowing now rather than in February.

  - id: ethics_statement
    name: Ethics Statement
    kind: form
    owner: student
    requirement: required
    per: member
    url: https://science-fair.org/wp/wp-content/uploads/2022/01/SCVSEFA_EthicsStatement_2022-01-05.pdf

  - id: application_form
    name: Bar-coded Project Application Form
    kind: form
    owner: student
    requirement: required
    guidance: Generated by the fair's own system, then uploaded to your forms folder.
