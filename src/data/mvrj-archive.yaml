- seq: 23
  slug: adversarial-networks-data-efficiency-self-driving-cars
  title: Applying adversarial networks to increase the data efficiency and reliability
    of Self-Driving Cars
  authors:
  - name: Aakash Kumar
    school: Monta Vista High School
  published_on: '2022-06-01'
  date_precision: month
  discipline: computer-science
  keywords:
  - adversarial examples
  - generative adversarial networks
  - autonomous vehicles
  - robustness
  - image classification
  abstract: >-
    Convolutional Neural Networks (CNNs) are vulnerable to misclassifying images
    when small perturbations are present. With the increasing prevalence of CNNs
    in self-driving cars, it is vital to ensure these algorithms are robust to
    prevent collisions from occurring due to failure in recognizing a situation.
    In the Adversarial Self-Driving framework, a Generative Adversarial Network
    (GAN) is implemented to generate realistic perturbations in an image that
    cause a classifier CNN to misclassify data. This perturbed data is then used
    to train the classifier CNN further. The Adversarial Self-driving framework
    is applied to an image classification algorithm to improve the classification
    accuracy on perturbed images and is later applied to train a self-driving
    car to drive in a simulation. A small-scale self-driving car is also built
    to drive around a track and classify signs. The Adversarial Self-driving framework
    produces perturbed images through learning a dataset, as a result removing
    the need to train on significant amounts of data. Experiments demonstrate
    that the Adversarial Self-driving framework identifies situations where CNNs
    are vulnerable to perturbations and generates new examples of these situations
    for the CNN to train on. The additional data generated by the Adversarial
    Self-driving framework provides sufficient data for the CNN to generalize
    to the environment. Therefore, it is a viable tool to increase the resilience
    of CNNs to perturbations. Particularly, in the real-world self-driving car,
    the application of the Adversarial Self-Driving framework resulted in an 18%
    increase in accuracy, and the simulated self-driving model had no collisions
    in 30 minutes of driving.
  source_pdf: Adversarial Self Driving.pdf
- seq: 24
  slug: dropout-regularization-and-model-complexity-in-neural-networks
  title: Investigating the Relationship Between Dropout Regularization and Model
    Complexity in Neural Networks
  authors:
  - name: Jai Sharma
    school: Monta Vista High School
  - name: Milind Maiti
    school: Monta Vista High School
  - name: Christopher Sun
    school: Monta Vista High School
  published_on: '2021-08-01'
  date_precision: month
  discipline: computer-science
  keywords:
  - dropout
  - regularisation
  - hyperparameter tuning
  - model complexity
  - neural networks
  abstract: >-
    Dropout Regularization, serving to reduce variance, is nearly ubiquitous in
    Deep Learning models. We explore the relationship between the dropout rate
    and model complexity by training 2,000 neural networks configured with random
    combinations of the dropout rate and the number of hidden units in each dense
    layer, on each of the three data sets we selected. The generated figures,
    with binary cross entropy loss and binary accuracy on the z-axis, question
    the common assumption that adding depth to a dense layer while increasing
    the dropout rate will certainly enhance performance. We also discover a complex
    correlation between the two hyperparameters that we proceed to quantify by
    building additional machine learning and Deep Learning models which predict
    the optimal dropout rate given some hidden units in each dense layer. Linear
    regression and polynomial logistic regression require the use of arbitrary
    thresholds to select the cost data points included in the regression and to
    assign the cost data points a binary classification, respectively. These machine
    learning models have mediocre performance because their naive nature prevented
    the modeling of complex decision boundaries. Turning to Deep Learning models,
    we build neural networks that predict the optimal dropout rate given the number
    of hidden units in each dense layer, the desired cost, and the desired accuracy
    of the model. Though, this attempt encounters a mathematical error that can
    be attributed to the failure of the vertical line test. The ultimate Deep
    Learning model is a neural network whose decision boundary represents the
    2,000 previously generated data points. This final model leads us to devise
    a promising method for tuning hyperparameters to minimize computational expense
    yet maximize performance. The strategy can be applied to any model hyperparameters,
    with the prospect of more efficient tuning in industrial models.
  source_pdf: Investigating_the_Relationship_Between_Dropout_Regularization_and_Model_Complexity_in_Neural_Networks.pdf
