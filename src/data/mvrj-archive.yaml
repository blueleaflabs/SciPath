# ===========================================================================
# THE MONTA VISTA RESEARCH JOURNAL BACK CATALOGUE.
#
# Twenty nine articles published between October 2020 and July 2024 on
# sites.google.com/view/mvrj, transcribed here so they can be loaded as
# permanent records by `scripts/seed-journal.mjs`. Section 4 of the design
# brief is the survey this comes from; `mvrj-migration-inventory.csv` is the
# recovery sheet that runs alongside it.
#
# **Twenty nine, not twenty eight.** Section 4.1 says twenty eight unique
# articles and then lists a year breakdown that sums to twenty nine, and the
# inventory has twenty nine rows. The Tanisha Sood paper is listed twice on
# the current site and appears once here, so the duplicate is not the
# difference. Twenty nine is what the page holds.
#
# ── What is verbatim and what is ours ─────────────────────────────────────
#
# **Titles, bylines, dates and abstracts are the authors' and are copied
# exactly.** Where a title was stored wrongly the corrected form is `title`
# and the published form is kept beside it in `title_as_published`, so the
# change is visible rather than silent. Two articles have no abstract on the
# current site and carry `abstract: null`; an abstract is the author's to
# supply and nothing here invents one.
#
# **Discipline and keywords are the journal's classification** and are a
# first pass to be reviewed. Discipline names the domain of the question,
# never the method (8.2), which is why a dozen machine learning papers land
# in eight different fields.
#
# ── Licence ───────────────────────────────────────────────────────────────
#
# Every record is `All rights reserved`, set in the loader rather than here
# because it is the same answer for all of them. None of these authors was
# ever asked to choose a licence, and putting CC BY on a paper on their
# behalf grants the world redistribution rights they did not give. A licence
# is changed per record when an author asks for one.
#
# ── Publishing and holding ────────────────────────────────────────────────
#
# A record loads unless it carries `publish: false`, and every held record
# says why in `hold_reason`. Three are held, all on decisions section 4
# leaves open: one politically sensitive subject and two studies with human
# participants. Releasing one is a single line.
#
# `prior_venue` is not a hold. Where a paper appeared somewhere first the
# record carries the venue and publishes as metadata and an abstract, which
# is the landing page 4.4 describes. Open decision 4 governs the full text,
# so the loader refuses to attach a PDF to a record with a prior venue until
# that is settled.
#
# `source_pdf` is the filename on the current site. It is how a recovered
# file is matched to its record and is not itself a claim that the file has
# been recovered.
#
# ── The papers ────────────────────────────────────────────────────────────
#
# The files live in `local-data/mvrj-pdfs/`, gitignored, because they are
# students' work rather than source code and a takedown must not be a history
# rewrite. Twenty three of the twenty nine are recovered; the other six were
# too large to hand over and are named in `tests/journal.mjs`. A record with
# no file publishes as its abstract and metadata, which is a working record
# and not a placeholder.
#
# A record with a `prior_venue` does not take its file even when one is
# present. Open decision 4 is the version of record, and the abstract with the
# venue named is the landing page 4.4 describes.
# ===========================================================================

records:
- seq: 1
  slug: qvista-quantum-vision-transformer-alzheimers
  title: 'QViSTA: A Novel Quantum Vision Transformer for Early Multi-Stage Alzheimer''s
    Diagnosis Using Optimized Variational Quantum Circuits'
  authors:
  - name: Aryan Singhal
    school: Monta Vista High School
  - name: Hursh Shah
    school: Monta Vista High School
  published_on: '2024-07-01'
  date_precision: month
  discipline: neuroscience
  keywords:
  - Alzheimer's disease
  - quantum machine learning
  - vision transformer
  - MRI
  - diagnosis
  abstract: >-
    Magnetic resonance imaging (MRI) is widely used by neurologists to detect
    brain abnormalities such as strokes, tumors, and various forms of dementia,
    including Alzheimer's disease. However, accurately diagnosing the different
    stages of Alzheimer's disease remains a challenge, with nearly one in five
    patients misdiagnosed due to symptom overlap with other conditions. This paper
    introduces QViSTA, a novel hybrid quantum vision transformer (QViT) model
    that exploits quantum parallelism to improve early diagnosis and differentiation
    of Alzheimer's disease stages. By integrating quantum variational circuits
    (VQCs) with vision transformers (ViTs), QViSTA addresses the data scalability
    and computational efficiency limitations of classical machine learning models.
    Using a balanced, multi-class dataset of 40,000 MRI images, QViSTA achieved
    a validation area under the receiver operating characteristic (AUC) of 87.86%
    and a test AUC of 86.67%, closely matching the performance of a benchmarked
    classical ViT while reducing feature space by 3.18%. Early and accurate detection
    of Alzheimer's disease is critical, as it allows for timely interventions
    that can significantly improve the quality of life for patients and their
    caregivers. As more hospitals adopt AI for biomedical imaging, QViSTA's innovative
    approach could dramatically reduce misdiagnosis rates, improve patient outcomes,
    and reduce costs.
  source_pdf: QViSTA.pdf
- seq: 2
  slug: pediatric-seizure-detection-system
  title: 'Pediatric Seizure Detection System: A Data-Driven Approach with Predictive
    and Generative AI Integration'
  authors:
  - name: Tanisha Sood
    school: Monta Vista High School
  published_on: '2024-06-01'
  date_precision: month
  discipline: neuroscience
  keywords:
  - epilepsy
  - seizure detection
  - wearable prototype
  - pediatrics
  - machine learning
  abstract: >-
    The gravity of seizures in pediatric populations cannot be overstated. From
    the youngest infants to adolescents on the brink of adulthood, seizures disrupt
    not only neurological functions but also the fabric of daily life. According
    to the Centers for Disease Control and Prevention, about 470,000 children
    in the United States have epilepsy, which is a neurological disorder characterized
    by recurrent seizures. Drawing from personal encounters with seizures, I recognize
    the critical need for effective seizure detection mechanisms. This study addresses
    the challenge of detecting seizures in children, especially in environments
    where constant supervision may not be feasible. Utilizing CAD, 3D design,
    and machine learning algorithms, this prototype predicts a seizure onset by
    analyzing bio data from a simulation of possible data sets carefully overviewed
    by my pediatrician Sara MachMan. The prototype integrates insights from a
    literature search, including the CDC publication on seizure detection, highlighting
    brain activity, fever, and body movements as triggers. Based on these triggers
    and thorough data analysis with a pediatrician, I was able to discover a breakthrough.
    Despite encountering a 15% error rate from my simulated data analysis, the
    prototype effectively alerts parents and medical professionals, demonstrating
    its potential to reduce the unpredictability of seizures and positively impact
    lives.
  source_pdf: Research Paper - Tanisha.pdf
  note: >-
    Listed twice on the current site with identical text. Published once here.
- seq: 3
  slug: chitosan-nanoparticles-seed-germination-glycine-max
  title: Utilizing Chitosan Nanoparticles To Deliver Natural Growth Promoters
    To Optimize Seed Germination In Glycine Max
  authors:
  - name: Praneel Shah
    school: Monta Vista High School
  published_on: '2024-06-01'
  date_precision: month
  discipline: biology-biomedicine
  keywords:
  - nanoparticles
  - chitosan
  - soybean
  - seed germination
  - zinc
  abstract: >-
    This project aims to create biodegradable nanoparticles that deliver zinc
    ions to the soybean plant using a slow-release mechanism, allowing for accelerated
    seed germination without introducing synthetic materials into the environment
    and limiting overfertilization of agricultural land. Nanoparticles were formed
    using Ionic Gelation through an alginate pre-gel matrix. Once the nanoparticle
    solution was formed, the solution was then diluted to concentrations of 0.25,
    0.5, and 1 mg/mL for further testing. Nanoparticle supplementation promoted
    shorter, thicker root growth in Glycine Max versus non-supplemented plants,
    suggesting improved zinc uptake as traditionally applied zinc fertilizers
    leach through the soil, requiring plants to develop longer roots to access
    it. Optimal growth was seen at 0.25 mg/mL, where plants doubled root quantity,
    increased root density by 74%, and shoot length by 25% under normal conditions.
    Under drought and nutrient deficient conditions, 0.25 mg/mL plants grew similarly
    to control conditions, suggesting nanoparticles improve water conservation
    within the plant and uptake of nutrients present in the soil ecosystem.
  source_pdf: MVRJ Paper_ Praneel Shah - praneel shah.pdf
- seq: 4
  slug: multi-source-data-fusion-flood-mapping
  title: Multi-Source Data Fusion for Flood Mapping in Response to Climate Change
  authors:
  - name: Advaith Anand
    school: Monta Vista High School
  published_on: '2024-06-01'
  date_precision: month
  discipline: earth-climate
  keywords:
  - flood mapping
  - synthetic aperture radar
  - U-Net
  - remote sensing
  - disaster response
  abstract: >-
    In the context of escalating climate change impacts, precise flood mapping
    has become crucial for effective disaster response and management. We address
    this challenge by developing a deep learning model based on the U-Net architecture,
    specifically tailored for rapid and accurate flood extent mapping using Synthetic
    Aperture Radar (SAR) data from the Copernicus Sentinel-1 mission published
    as part of IEEE 2024 GRSS data fusion challenge. Our approach leverages the
    unique capabilities of U-Net for detailed image segmentation, combined with
    SAR imagery, digital elevation models, land-use patterns, and historical water
    presence data to differentiate between water and non-water surfaces accurately.
    The model was rigorously trained and validated across a comprehensive dataset
    representing a variety of geographic conditions and flood events. It demonstrated
    significant advancements over traditional flood mapping techniques, achieving
    an overall accuracy of 95% and an F1-score of 0.7. These metrics underscore
    the model's effectiveness in accurately classifying flooded areas. Furthermore,
    the model exhibits excellent scalability and adaptability, offering potential
    applications beyond the initial flood mapping scope to other environmental
    and disaster management scenarios. Our findings not only contribute to the
    improvement of flood response strategies but also underscore the potential
    of advanced machine learning techniques in enhancing the accuracy and efficiency
    of environmental monitoring in the face of global climate challenges. This
    research represents a significant step forward in the application of deep
    learning to hydrological extremes, providing a robust tool for emergency response
    planners and climate scientists alike.
  prior_venue: IEEE 2024 GRSS Data Fusion Contest
  source_pdf: Multi-Source Flood Mapping - Advaith Anand.pdf
  note: >-
    The abstract names the IEEE 2024 GRSS data fusion challenge. Open decision
    4 governs whether the full text is ever attached.
- seq: 5
  slug: machine-learning-risk-analysis-israeli-palestinian-conflict-zones
  title: Developing a Novel Machine Learning Based Approach for Enhanced Risk
    Analysis in Israeli-Palestinian Conflict Zones
  authors:
  - name: Tashvi Bansal
    school: Monta Vista High School
  published_on: '2024-06-01'
  date_precision: month
  discipline: social-science
  keywords:
  - geospatial risk analysis
  - conflict zones
  - K-nearest neighbours
  - bootstrapping
  - humanitarian technology
  abstract: >-
    The Israeli-Palestinian conflict poses significant safety challenges for individuals
    in affected regions. However, predictive mechanisms can help individuals navigate
    war areas, enabling proactive decision-making necessary for tasks like traveling
    to hospitals or obtaining food supplies. This project leverages novel machine
    learning techniques to conduct geospatial risk analysis in these conflict
    zones. I initially modeled fatality frequencies from geographic coordinates
    using regression. However, drawbacks included poor user-friendliness and less-accurate
    predictions. Thus, I explored classification models. Though the Random-Forest
    model initially showed promising accuracy, on-field testing revealed significant
    data imbalances. I then shifted to K-means clustering to preserve data representative
    variance, but its dependency on fatality frequency data was impractical. Consequently,
    I shifted to the KNN algorithm for improved data compatibility, but it necessitated
    comprehensive data augmentation and preprocessing. To address the imbalance,
    my initial attempt to normalize data by population failed to capture data
    variance. Thus, I created a multi-phase bootstrapping algorithm to generate
    data from highly imbalanced data. After evenly generating data with coordinate-offsets
    using trigonometry to account for Earth's geometry, the points lacked spatial
    awareness. To resolve this, I applied the Haversine formula to dynamically
    adjust risk classifications based on proximity to higher-risk areas. I then
    integrated the optimal KNN model (96.57% accuracy) using cross-validation
    metrics into an application to perform on-field testing. Furthermore, the
    app has the potential to evolve from prototype to global use, which is why
    I'm engaging with larger companies for feature-integration into their platforms.
    Ultimately, this project establishes a new standard for peace technology development
    for global-conflicts.
  source_pdf: final research paper -- tashvi bansal -- mvrj (1) - Tashvi Bansal.pdf
  publish: false
  hold_reason: >-
    Open decision 6. Republishing a politically sensitive paper under a school-branded,
    search-indexed domain with a named minor author is an editorial decision to
    take deliberately. Set publish: true to release it.
- seq: 6
  slug: biological-aging-clock-dna-methylation-skeletal-muscle
  title: Development of an Accurate Biological Aging Clock Using Machine Learning
    Models and DNA Methylation Patterns in Skeletal Muscle
  authors:
  - name: Rishab Perati
    school: Monta Vista High School
  published_on: '2024-06-01'
  date_precision: month
  discipline: biology-biomedicine
  keywords:
  - epigenetics
  - DNA methylation
  - aging clock
  - elastic net
  - skeletal muscle
  abstract: >-
    Objective: A leading challenge in aging research is measuring age accurately,
    as monitoring healthy individuals over decades to assess the effects of interventions
    for the aging process is time and cost-prohibitive. The goal of this work
    was to develop an accurate epigenetic skeletal muscle-based aging clock using
    high-dimensional DNA methylation patterns to calculate chronological age.
    Method: Genome-wide DNA methylation values from skeletal muscle tissue samples
    from 47 individuals with 200,000 methylation sites (CpGs) per sample were
    used for the study. Feature selection was used to narrow down CpGs. An Elastic
    Net regression model with a Leave-One-Sample-Out Cross-Validation (LO-SAMPLE-OCV)
    was used to evaluate feature relevance and model performance. I then implemented
    an ensemble approach where predictions from the LO-SAMPLE-OCV process served
    as inputs to another model using ElasticNet regression. This two-step approach
    leverages the strengths of ElasticNet for both feature selection and meta-learning,
    aiming to enhance predictive accuracy while also capturing the complex relationships
    of high-dimensional data. Results & Conclusion: The model outperformed the
    Voisin et. al. method against the performance metrics of median absolute age
    differences (6.5 years using the Voisin method versus 1.9 years and 2.31 years
    using the LO-SAMPLE-OCV and ensemble methods respectively) and mean age differences
    (1.9 years using the Voisin method versus 0.26 years and -0.17 years using
    the LO-SAMPLE-OCV and ensemble methods respectively). Impact: This tool can
    be used to accurately predict and understand aging to develop interventions
    for the prevention, early detection, diagnosis, and treatment of aging-related
    diseases, including cancer.
  source_pdf: Epigenetic Aging Paper - Rishab Perati.pdf
- seq: 7
  slug: deep-learning-pipeline-drought-assessment-vision-transformers
  title: A Deep Learning Pipeline for Drought Assessment using Spatial Satellite
    Images and Vision Transformers
  authors:
  - name: Aaryan Doshi
    school: Monta Vista High School
  published_on: '2024-06-01'
  date_precision: month
  discipline: earth-climate
  keywords:
  - drought
  - satellite imagery
  - vision transformer
  - remote sensing
  - climate adaptation
  abstract: >-
    700 million people are in danger of being displaced due to inept drought prediction
    and prevention systems. Current research on drought assessment focuses solely
    on factors such as soil moisture and rainfall, which require painstaking measurements
    and lab samples, and can often be misleading. This research eliminates this
    requirement by proposing an end-to-end pipeline to detect and prevent droughts
    in at-risk areas using satellite images and vision transformers. The dataset
    is comprised of over 86,000 satellite images labeled by pastoralists and divided
    with an 80-20 ratio for training and validation. First, using feature filtering,
    normalization, and a Gaussian filter, the images in the dataset are modified
    to yield a better performance. Next, a deep vision transformer model with
    multi-headed attention is constructed, consisting of four heads, three transformer
    layers, and a patch size of five. The final MLP head produces logits for drought
    severity prediction level. Overall, the best transformer model achieves 78.3%
    accuracy in predicting drought conditions on a validation set of 10,000, unseen
    satellite images. In addition, this method outperforms state-of-the-art convolutional
    neural networks on this classification task, as compared to VGG-16, ResNet-50
    and DenseNet-121 models. The model harnesses AWS cloud computing, deep vision
    transformers, and specific image augmentation to achieve state-of-the-art
    results in drought prediction and prevention. With this research, scientists
    have the potential to assess droughts quickly and accurately, revolutionizing
    our ability to provide resources and care to those affected by the increasingly
    common droughts caused by the climate crisis worldwide.
  source_pdf: Drought Transformer - Aaryan Doshi.pdf
- seq: 8
  slug: detecting-music-enjoyment-eeg-machine-learning
  title: Detecting Music Enjoyment Level Using Electroencephalogram Signals and
    Machine Learning Techniques
  authors:
  - name: Raymond Feng
    school: Monta Vista High School
  published_on: '2024-06-01'
  date_precision: month
  discipline: neuroscience
  keywords:
  - electroencephalography
  - affective computing
  - power spectral density
  - music
  - classification
  abstract: >-
    An electroencephalogram (EEG) is a non-invasive technique that records electrical
    activity in the brain using scalp electrodes. Researchers have studied the
    use of EEG to detect emotions and moods by collecting signals from participants
    and analyzing how those signals correlate with their activities. In this study,
    researchers investigated the relationship between EEG signals and music enjoyment.
    Participants listened to music while EEG signals were collected. During the
    signal-processing phase, power spectral densities (PSDs) were computed from
    the signals, and dominant brainwave frequencies were extracted from the PSDs
    to form a comprehensive feature matrix. A machine learning approach was then
    taken to find correlations between the processed data and the music enjoyment
    level indicated by the participants. To improve on previous research, multiple
    machine learning models were employed, including K-Nearest Neighbors Classifier,
    Support Vector Classifier, and Decision Tree Classifier. Hyperparameters were
    used to fine-tune each model to further increase its performance. The experiments
    showed that a strong correlation exists, with the Decision Tree Classifier
    with hyperparameters yielding 85% accuracy. This study proves that EEG is
    a reliable means to detect music enjoyment and has future applications including
    personalized music recommendation, mood adjustment, and mental health therapy.
  source_pdf: RaymondFeng_MusicEEG.pdf
  publish: false
  hold_reason: >-
    Human participants. Section 4.4 asks that consent documentation be confirmed
    before republication under a domain with real search visibility. Set publish:
    true once that is on file.
- seq: 9
  slug: plapt-protein-ligand-binding-affinity-pretrained-transformers
  title: 'PLAPT: Protein-Ligand Binding Affinity Prediction Using Pre-Trained
    Transformers'
  title_as_published: 'PLAPT: PROTEIN-LIGAND BINDING AFFINITY PREDICTION USING
    PRE-TRAINED TRANSFORMERS'
  authors:
  - name: Tyler Rose
    school: Monta Vista High School
  - name: Nicolò Monti
    school: null
    byline_only: true
  - name: Navvye Anand
    school: null
    byline_only: true
  - name: Tianyu Shen
    school: null
    byline_only: true
  published_on: '2024-06-01'
  date_precision: month
  discipline: biology-biomedicine
  keywords:
  - drug discovery
  - binding affinity
  - transfer learning
  - ProtBERT
  - ChemBERTa
  abstract: >-
    Predicting protein-ligand binding affinity is crucial for drug discovery,
    as it enables efficient identification of drug candidates. We introduce PLAPT,
    a novel model utilizing transfer learning from pre-trained transformers like
    ProtBERT and ChemBERTa to predict binding affinities with high accuracy. Our
    method processes one-dimensional protein and ligand sequences, leveraging
    a branching neural network architecture for feature integration and affinity
    estimation. We demonstrate PLAPT's superior performance through validation
    on multiple datasets, achieving state-of-the-art results while requiring significantly
    less computational resources for training compared to existing models. Our
    findings indicate that PLAPT offers a highly effective and accessible approach
    for accelerating drug discovery efforts.
  source_pdf: Tyler_PLAPT.pdf
  note: >-
    Stored in full capitals on the current site; sentence case restored here.
    Three co-authors appear to be outside Monta Vista and carry plain-text bylines
    with no author page (8.10).
- seq: 10
  slug: watergate-accessible-computational-model-of-flooding-patterns
  title: 'WaterGate: An Accessible Computational Model of Flooding Patterns'
  authors:
  - name: Navvye Anand
    school: null
    byline_only: true
  - name: George Cheng
    school: null
    byline_only: true
  - name: Tyler Rose
    school: Monta Vista High School
  published_on: '2024-06-01'
  date_precision: month
  discipline: earth-climate
  keywords:
  - computational hydrology
  - flood modelling
  - rational method
  - elevation data
  - 3D visualisation
  abstract: >-
    240 million people are affected by floods each year, reflecting the urgent
    need for accessible flood prediction and detection. WaterGate is a computational
    model that uses geographic elevation data and the rational method to predict
    flooding patterns, generating an interactive 3D model for user accessibility.
    Computational hydrology applies numerical methods, machine learning algorithms,
    and computational simulations to understand, predict, and manage water resources,
    including floods. Our project employs computational hydrology by analyzing
    the structure of river tributaries in 2D through polygon clustering, satellite
    imaging, and various cleaning protocols. We developed respective tributary
    tree graphs, morphological graphs, and nodes to create a comprehensive tree
    and 3D model. Afterward, we examine the morphology of flood plains in 3D space,
    implementing the rational method (Q = CiA) framework with curated relief plots
    to predict, model, and visualize flooding elevation. Then, we constructed
    our stream order analysis, waterline delineation, and statistical analysis
    to validate our data. Lastly, we modeled different river systems and developed
    further extensions to increase the applicability of WaterGate to communities
    around the world.
  source_pdf: Tyler_Watergate.pdf
  note: >-
    Overlapping author set with PLAPT.
- seq: 11
  slug: inferring-hate-speech-trends-contemporary-tweets
  title: Inferring Hate Speech Trends for Contemporary Tweets Using a Novel Machine
    Learning Approach from Supervised Learning Algorithms
  authors:
  - name: Aryan Singhal
    school: Monta Vista High School
  published_on: '2023-07-01'
  date_precision: month
  discipline: social-science
  keywords:
  - hate speech
  - social media
  - naive Bayes
  - natural language processing
  - content moderation
  abstract: >-
    Social media platforms such as Twitter have become ubiquitous in our contemporary
    society, providing a platform for individuals to express their opinions and
    engage in discussions on a wide range of topics including those that are neutral
    and controversial. However, the growing popularity of Twitter has also led
    to an increase in the prevalence of hate speech, which raises concerns about
    its impact on individuals and society. This research investigates hate speech
    trends on Twitter by utilizing supervised machine learning classification,
    specifically Naive Bayes, and employing Natural Language Processing (NLP)
    features such as on a range of neutral and controversial topics. The study
    compares the prevalence of hate speech in these topics and tracks such trends
    from January 2022 to January 2023. The results show that hate speech was nearly
    400% more prevalent in controversial topics than in neutral topics over the
    course of the year. In addition, this research finds that controversial topics
    are consistently more vulnerable to hate speech throughout the course of the
    year when compared to neutral topics. To conduct this study, a Multinomial
    Naive Bayes classification model was trained on a publicly available Twitter
    dataset that was specifically labeled for semantic hate speech and achieved
    an accuracy rate of 94.46%. Ultimately, the higher vulnerability of controversial
    topics should necessitate policymakers to introduce stricter warnings or frequent
    policy reminders to platform users. Such changes will foster a respectful
    and inclusive platform for users, preserving their freedom of expression and
    encouraging constructive discussions.
  source_pdf: Aryan Singhal Research Paper 2023 - Aryan Singhal.pdf
- seq: 12
  slug: correcting-mislabeled-quasars-in-extragalactic-catalogs
  title: Correcting Mislabeled Quasars in Extragalactic Catalogs
  authors:
  - name: Arjun Shrivastava
    school: Monta Vista High School
  published_on: '2023-06-01'
  date_precision: month
  discipline: astronomy-astrophysics
  keywords:
  - quasars
  - active galactic nuclei
  - light curves
  - LSTM
  - sky surveys
  abstract: >-
    Quasars, a type of active galactic nuclei (AGNs), are some of the brightest
    objects in the universe. They allow astronomers to accurately observe distant
    objects and look farther back in time, offering researchers a better understanding
    of our universe's history. However, the X-ray and extragalactic databases
    that catalog astronomical objects often mislabel quasars as other objects.
    Therefore, I seek to improve these classifications by identifying quasars
    in the Deep Fields component of the Canada-France-Hawaii Telescope Legacy
    Survey (CFHTLS) database and cross-checking them with the extragalactic catalogs.
    The typical method of classifying an object as a quasar is via manual visual
    classification: examining unfolded light curves for star-like objects that
    exhibit irregular short-term and long-term variations in brightness. Unfortunately,
    this is time-intensive and prone to human error, so I attempted to accelerate
    the process and boost accuracy with deep neural networks. I first visually
    classified data of about 4,000 objects for my training set and included four
    different filters. After preprocessing, I trained a Long Short-Term Memory
    (LSTM) neural network with different variations of hyperparameters until I
    achieved an accuracy of 97.5%. When I ran my model through my data, it identified
    992 new quasars, 796 of them being actually quasars while the rest were misclassified,
    yielding an overall binary accuracy of 80% for the entire CHFTLS Deep Field
    database. Of the identified quasars, 14.8% of which were new quasars and 83.3%
    were mislabeled in the NASA/IPAC Extragalactic Database (NED). Many of the
    mislabeled quasars tended to appear as galaxies as well as unidentified sources
    of ultraviolet or X-ray radiation. In the future, I seek to improve my model
    for higher accuracy.
  source_pdf: Correcting_Mislabeled_Quasars_in_Extragalactic_Catalogs_3_1.pdf
- seq: 13
  slug: pillar-based-overhang-generation-3d-printing
  title: Pillar-Based Overhang Generation to Reduce Waste in 3D Printing
  authors:
  - name: Raymond Feng
    school: Monta Vista High School
  published_on: '2023-06-01'
  date_precision: month
  discipline: engineering-robotics
  keywords:
  - additive manufacturing
  - support structures
  - material waste
  - algorithms
  - 3D printing
  abstract: >-
    Pillar-Based Overhang Generation, or PBOG, is a novel algorithm that generates
    support structures for 3D printing. In 3D printing, overhangs are parts in
    midair that cannot be printed. The most popular way to overcome this issue
    is to add support structure. The PBOG algorithm is proposed to decrease material
    usage in support structure. The algorithm uses three steps: overhang detection,
    vertex simplification, and pillar generation. Compared with Cura and Meshmixer,
    results show that PBOG uses less waste and has a higher success rate. In conclusion,
    PBOG outperforms currently popular methods Cura and Meshmixer in material
    waste and success rate.
  prior_venue: IYRC
  source_pdf: IYRC_RaymondFeng_Paper_FINAL.docx - Google Docs.pdf
  note: >-
    Source filename references IYRC. Confirm the venue before any full text is
    attached. Open decision 4.
